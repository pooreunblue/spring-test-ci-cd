services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./service-url.inc:/etc/nginx/conf.d/service-url.inc:ro
    depends_on:
      - app-blue
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - frontend-net

  app-blue:
    # 이건 활용하셔도 되는데... 문제가 그러면은 여러분들게 아니라 제걸 쓰게됨
    image: ghcr.io/a1l1ke/260918_ci-cd:latest
    container_name: app-blue
    restart: on-failure
    ports:
      - "8081:8080"
    deploy:
      resources:
        limits:
          memory: 896M
    networks:
      - frontend-net

  app-green:
    # 이건 활용하셔도 되는데... 문제가 그러면은 여러분들게 아니라 제걸 쓰게됨
    image: ghcr.io/a1l1ke/260918_ci-cd:latest
    container_name: app-green
    restart: on-failure
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          memory: 896M
    networks:
      - frontend-net

networks:
  frontend-net: